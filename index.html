<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imah Kayu Jatinangor</title>
    <meta name="description" content="Sistem Operasional Restoran Imah Kayu Jatinangor - POS Kasir, Absensi Selfie GPS, Inventaris & Manajemen Shift." />
    <meta property="og:title" content="Imah Kayu Jatinangor" />
    <meta property="og:description" content="Sistem Operasional Restoran Imah Kayu Jatinangor - POS Kasir, Absensi Selfie GPS, Inventaris & Manajemen Shift." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23059669'/%3E%3Crect x='2' y='2' width='60' height='60' rx='16' fill='none' stroke='%23ffffff' stroke-opacity='0.25' stroke-width='2'/%3E%3Ctext x='32' y='42' font-family='sans-serif' font-size='26' font-weight='900' fill='%23ffffff' text-anchor='middle'%3EIK%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23059669'/%3E%3Ctext x='32' y='42' font-family='sans-serif' font-size='26' font-weight='900' fill='%23ffffff' text-anchor='middle'%3EIK%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="app-boot-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; text-align: center;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #059669, #0d9488); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 24px; color: white; margin-bottom: 16px; box-shadow: 0 10px 25px rgba(5,150,105,0.4);">
          IK
        </div>
        <div style="font-size: 16px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px;">
          Imah Kayu Jatinangor
        </div>
        <div style="font-size: 12px; color: #94a3b8; margin-bottom: 20px;">
          Menyiapkan Sistem Operasional & POS...
        </div>
        <div style="width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #10b981; border-radius: 50%; animation: ik_spin 0.8s linear infinite;"></div>
        <style>
          @keyframes ik_spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>

    <script>
      // Global fail-safe: Catch any runtime or bundle error preventing app mount
      window.addEventListener('error', function(e) {
        console.error('[GlobalError]', e);
        var loader = document.getElementById('app-boot-loader');
        if (loader) {
          loader.innerHTML = `
            <div style="max-width: 440px; width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
              <div style="font-size: 32px; margin-bottom: 12px;">⚠️</div>
              <h2 style="font-size: 16px; font-weight: 800; color: #f8fafc; margin: 0 0 8px;">Kendala Memuat Modul</h2>
              <p style="font-size: 12px; color: #94a3b8; margin: 0 0 16px; line-height: 1.5;">
                ${e.message || 'Terjadi kesalahan skrip pada browser.'}
              </p>
              <div style="display: flex; flex-direction: column; gap: 8px;">
                <button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload();" style="background: #e11d48; color: #fff; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer;">
                  🧹 Bersihkan Cache & Muat Ulang
                </button>
                <button onclick="window.location.reload();" style="background: #334155; color: #f8fafc; border: 1px solid #475569; padding: 10px 14px; border-radius: 10px; font-weight: 600; font-size: 12px; cursor: pointer;">
                  🔄 Muat Ulang Halaman
                </button>
                <button onclick="window.open(window.location.href, '_blank');" style="background: transparent; color: #38bdf8; border: none; padding: 6px; font-size: 11px; text-decoration: underline; cursor: pointer;">
                  ↗ Buka di Tab Baru
                </button>
              </div>
            </div>
          `;
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
